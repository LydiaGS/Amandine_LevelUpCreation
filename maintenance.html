<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Page en maintenance | Level Up Creation</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:#0f0f0f;
color:white;
display:flex;
align-items:center;
justify-content:center;
height:100vh;
text-align:center;
}

.maintenance{
max-width:600px;
padding:40px;
}

.maintenance h1{
font-size:48px;
margin-bottom:20px;
background:linear-gradient(90deg,#df437c,#ff7aa2);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.maintenance p{
color:#aaa;
line-height:1.6;
margin-bottom:30px;
font-size:18px;
}

/* bouton */

.maintenance a{
display:inline-block;
padding:12px 22px;
border-radius:8px;
text-decoration:none;
color:white;
background:#df437c;
transition:0.3s;
}

.maintenance a:hover{
background:#c9356d;
}

/* HAMSTER */

.hamster-container{
margin:40px auto;
width:150px;
height:150px;
position:relative;
}

.wheel{
width:185px;
height:185px;
border:16px solid #df437c;
border-radius:50%;
position:absolute;
animation:spin 2s linear infinite;
}

.hamster{
display: flex;
font-size:130px;
position:absolute;
top:70%;
left:70%;
transform:translate(-50%,-50%);
justify-content: center;
align-items: center;
text-align: center;
animation:run 0.4s infinite alternate;
}
@keyframes spin{
from{transform:rotate(0deg);}
to{transform:rotate(360deg);}
}

@keyframes run{
from{transform:translate(-50%,-50%) rotate(-10deg);}
to{transform:translate(-50%,-50%) rotate(10deg);}
}

</style>

</head>

<body>

<div class="maintenance">

<h1 style="font-size: 50px;">Page en maintenance</h1>

<p style="font-size: 25px;">
Nous nous excusons pour la gêne occasionnée.
Cette page est actuellement en cours de mise à jour.
</p>
<br>
<div class="hamster-container">

<div class="wheel"></div>
<div class="hamster">🛠️</div>

</div>
<br><br><br><br><br>
<a href="./index.html">Retour à l'accueil</a>

</div>

</body>

</html>
