<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="alternate" hreflang="fr" href="https://levelupcreation.com/fr/dashboard.html">
    <link rel="alternate" hreflang="en" href="https://levelupcreation.com/en/dashboard.html">
    <link rel="alternate" hreflang="nl" href="https://levelupcreation.com/nl/dashboard.html">
    <link rel="alternate" hreflang="x-default" href="https://levelupcreation.com/fr/dashboard.html">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/font.css">
    <link rel="stylesheet" href="./css/dashboard.css">
    <title>Dashboard Client | LevelUpCreation</title>
</head>
<body>
    <header class="site-header" id="top">
    <nav class="nav">
      <a class="brand" href="#top" aria-label="Level Up Creation - Accueil">
        <span class="brand__logo">
          <img src="./asset/image/LOGO LVLUP_Ivoire 01.png" alt="Level Up Creation">
        </span>
        <span class="brand__name">Level Up Creation</span>
      </a>


      <button class="nav__toggle" id="navToggle" aria-label="Ouvrir le menu" aria-expanded="false">
        <span class="nav__toggle-bars" aria-hidden="true"></span>
      </button>

      <div class="nav__links" id="navLinks">
        <a class="nav__link" href="./index.html">Accueil</a>
   <a class="nav__link " href="./infos.html">
    À propos
  </a>

        <a class="nav__link" href="./tarif.html">Tarifs</a>
        <a class="nav__link" href="./realisation.html">Nos réalisations</a>
        <a class="nav__link" href="./contact.html">Contact</a>
      <a class="nav__link" href="./dashboard.html">Dashboard</a>
      </div>
    </nav>
  </header>
    <!-- Loading Screen -->
    <div id="loading">
        <div class="loader"></div>
        <div class="loading-text">Chargement de votre espace...</div>
    </div>

    <!-- Admin Badge -->
    <div id="adminBadge" class="admin-badge">
        Mode Admin activé
    </div>

    <!-- Main Container -->
    <div class="container" id="mainContent" style="display: none;">
        <!-- Header -->
        <div class="header">
            <div class="logo">LevelUpCreation</div>
            <div class="header-actions">
                <button class="btn-logout" id="logoutBtn">Se déconnecter</button>
            </div>
        </div>
<!-- Profile Card -->
<div class="profile-card fade-in">
    <div class="profile-header">
        <div class="profile-photo-container">
            <img id="profilePhoto" class="profile-photo" src="" alt="Photo de profil">
            <label for="photoInput" class="photo-upload-btn" title="Changer la photo">
                📷
            </label>
            <input type="file" id="photoInput" accept="image/*" style="display: none;">
        </div>
        <div class="profile-info">
            <h2 id="userName">Chargement...</h2>
            <p id="userEmail">email@example.com</p>
            <p class="project-name" id="projectName">Projet: -</p>
        </div>
    </div>

    <div class="progress-section">
        <div class="progress-label">
            <span>Avancement global du projet</span>
            <span id="globalProgress">0%</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>
    </div>
</div>

        <!-- Project Steps Section -->
        <section>
            <h3 class="section-title">Avancement du Projet</h3>
            <div class="steps-grid" id="stepsContainer"></div>
        </section>

        <!-- Formations Section -->
        <section>
            <h3 class="section-title">Mes Formations</h3>
            <div class="formations-grid" id="formationsContainer"></div>
        </section>
    </div>
    <script src="./javascripts/404.js"></script>
<script src="./javascripts/scripts.js"></script>
   <script type="module" src="./javascripts/dashboard.js">
</script>
</body>
</html>
