<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.ico">
  <link rel="icon" href="./asset/image/LOGO LVLUP_Ivoire 02.png">
  <link rel="stylesheet" href="./css/admin.css">
  <link rel="stylesheet" href="./css/style.css">
  <title>Level Up Creation - Notifications Firebase</title>
<body>  
    <!-- Top glow / background -->
<div class="bg-ambient" aria-hidden="true"></div>

<header class="site-header" id="top">
<nav class="nav">

<a class="brand" href="./dashboard.html" aria-label="Level Up Creation - Accueil">
<span class="brand__logo">
<img src="./asset/image/LOGO LVLUP_Ivoire 01.png" alt="Level Up Creation">
</span>
<span class="brand__name">DASHBOARD</span>
</a>

<button class="nav__toggle" id="navToggle" aria-label="Ouvrir le menu" aria-expanded="false">
<span class="nav__toggle-bars" aria-hidden="true"></span>
</button>
</nav>
</header>
<br>
  <!-- MAIN CONTENT -->
  <main class="container" style="margin-top: 200px;">
    <h1>Page Admin</h1>
    <br>
    <h2>Envoye de notifications</h2>
    <br>
    <!-- Formulaire d'envoi -->
    <section class="notification-form"> 
   <form id="notificationForm">

<div class="form-group">
<label for="notifTitle">Titre</label>
<input type="text" id="notifTitle" required>
</div>

<div class="form-group">
<label for="notifMessage">Message</label>
<textarea id="notifMessage" required></textarea>
</div>

<div class="form-group">
<label for="notifType">Type</label>
<select id="notifType">
<option value="info">ℹ️ Information</option>
<option value="success">✅ Succès</option>
<option value="warning">⚠️ Attention</option>
<option value="formation">🎓 Formation</option>
<option value="service">🛠️ Service</option>
<option value="promotion">🎉 Promotion</option>
</select>
</div>

<div class="form-group">
<label for="notifUserId">UID du client</label>
<input type="text" id="notifUserId" placeholder="UID Firebase du client" required>
</div>

<button type="submit" class="btn">
Envoyer la Notification
</button>

</form>
    </section>
   
  </main>
<script src="./javascripts/admin.js" type="module"></script>


</body>
</html>
